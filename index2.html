<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Data Mahasiswa - LocalStorage</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:20px;
            background:#f5f5f5;
        }

        form{
            background:#fff;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }

        input,
        textarea,
        select{
            width:100%;
            padding:10px;
            margin:5px 0 15px;
            box-sizing:border-box;
            resize:none;
        }

        .radio-group{
            margin-bottom:15px;
        }

        .radio-group input{
            width:auto;
        }

        button{
            padding:10px 15px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
        }

        .submit{
            background:#28a745;
            color:white;
        }

        .reset{
            background:#ffc107;
            color:white;
        }

        .btn-aksi{
            padding:5px 12px;
            margin:2px;
            font-size:18px;
            border-radius:5px;
            color:white;
        }

        .btn-edit{
            background:#007bff;
        }

        .btn-delete{
            background:#dc3545;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,
        td{
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }

        th{
            background:#eee;
        }

    </style>

</head>
<body>

<h2>Form Data Mahasiswa</h2>

<form id="formMahasiswa">

    <!-- NIM -->
    <label>NIM</label>
    <input type="text" id="nim" required>

    <!-- Nama -->
    <label>Nama</label>
    <input type="text" id="nama" required>

    <!-- Alamat -->
    <label>Alamat</label>
    <textarea id="alamat" rows="3"></textarea>

    <!-- Jenis Kelamin -->
    <label>Jenis Kelamin</label>

    <div class="radio-group">
        <input type="radio" name="jk" value="Pria"> Pria
        <input type="radio" name="jk" value="Wanita"> Wanita
        <input type="radio" name="jk" value="Lainnya"> Lainnya
    </div>

    <!-- Tanggal Lahir -->
    <label>Tanggal Lahir</label>

    <div style="display:flex; gap:10px;">

        <!-- tanggal -->
        <select id="tanggal"></select>

        <!-- bulan -->
        <select id="bulan">

            <option value="01">Januari</option>
            <option value="02">Februari</option>
            <option value="03">Maret</option>
            <option value="04">April</option>
            <option value="05">Mei</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">Agustus</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>

        </select>

        <!-- tahun -->
        <select id="tahun"></select>

    </div>

    <!-- Password -->
    <label>Password</label>
    <input type="password" id="password">

    <!-- tombol -->
    <button type="submit" class="submit">
        Simpan Data
    </button>

    <button type="reset" class="reset" onclick="clearForm()">
        Reset
    </button>

</form>

<!-- DATA -->
<h2>Data Mahasiswa</h2>

<div style="margin-bottom:10px; display:flex; gap:10px;">

    <input
        type="text"
        id="searchInput"
        placeholder="Cari Nama atau NIM..."
        onkeyup="searchTable()"
    >

    <button
        type="button"
        style="width:180px; background:#2196F3; color:white;"
        onclick="searchTable()"
    >
        Cari
    </button>

</div>

<table>

    <thead>

        <tr>

            <th>NIM</th>
            <th>Nama</th>
            <th>Alamat</th>
            <th>JK</th>
            <th>Tanggal Lahir</th>
            <th>Password</th>
            <th>Aksi</th>

        </tr>

    </thead>

    <tbody id="tableBody"></tbody>

</table>

<script>

    // =====================================================
    // AMBIL ELEMENT
    // =====================================================

    const form = document.getElementById("formMahasiswa");
    const tableBody = document.getElementById("tableBody");

    // =====================================================
    // DROPDOWN TAHUN
    // =====================================================

    for(let i = 1990; i <= 2026; i++){

        document.getElementById("tahun").innerHTML += `
            <option value="${i}">
                ${i}
            </option>
        `;
    }

    // =====================================================
    // UPDATE JUMLAH TANGGAL
    // =====================================================

    function updateTanggal(){

        const bulan = document.getElementById("bulan").value;
        const tahun = document.getElementById("tahun").value;
        const tanggalSelect = document.getElementById("tanggal");

        // simpan tanggal sebelumnya
        let selectedTanggal = tanggalSelect.value;

        // jumlah hari otomatis
        const jumlahHari = new Date(tahun, bulan, 0).getDate();

        // kosongkan dropdown
        tanggalSelect.innerHTML = "";

        // isi ulang tanggal
        for(let i = 1; i <= jumlahHari; i++){

            let val = i < 10 ? "0" + i : i;

            tanggalSelect.innerHTML += `
                <option value="${val}">
                    ${val}
                </option>
            `;
        }

        // kembalikan tanggal lama jika masih valid
        if(selectedTanggal <= jumlahHari){
            tanggalSelect.value = selectedTanggal;
        }
    }

    // pertama kali load
    updateTanggal();

    // saat bulan berubah
    document.getElementById("bulan")
        .addEventListener("change", updateTanggal);

    // saat tahun berubah
    document.getElementById("tahun")
        .addEventListener("change", updateTanggal);

    // =====================================================
    // LOAD DATA
    // =====================================================

    document.addEventListener("DOMContentLoaded", displayData);

    // =====================================================
    // SUBMIT FORM
    // =====================================================

    form.addEventListener("submit", function(e){

        e.preventDefault();

        const dataMahasiswa = {

            nim: document.getElementById("nim").value,

            nama: document.getElementById("nama").value,

            alamat: document.getElementById("alamat").value,

            jk: document.querySelector('input[name="jk"]:checked')?.value || "-",

            ttl: `
                ${document.getElementById("tanggal").value}-
                ${document.getElementById("bulan").value}-
                ${document.getElementById("tahun").value}
            `,

            password: document.getElementById("password").value

        };

        saveToLocalStorage(dataMahasiswa);

        form.reset();

        updateTanggal();

        displayData();

    });

    // =====================================================
    // SIMPAN LOCAL STORAGE
    // =====================================================

    function saveToLocalStorage(obj){

        let list = JSON.parse(localStorage.getItem("mhsList")) || [];

        // cek nim
        const index = list.findIndex(item => item.nim === obj.nim);

        if(index !== -1){

            // update
            list[index] = obj;

        }else{

            // tambah
            list.push(obj);
        }

        localStorage.setItem("mhsList", JSON.stringify(list));
    }

    // =====================================================
    // TAMPILKAN DATA
    // =====================================================

    function displayData(){

        tableBody.innerHTML = "";

        let list = JSON.parse(localStorage.getItem("mhsList")) || [];

        list.forEach((mhs) => {

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${mhs.nim}</td>

                <td>${mhs.nama}</td>

                <td>${mhs.alamat}</td>

                <td>${mhs.jk}</td>

                <td>${mhs.ttl}</td>

                <!-- PASSWORD JADI BINTANG -->
                <td>${"*".repeat(mhs.password.length)}</td>

                <td>

                    <!-- EDIT -->
                    <button
                        class="btn-aksi btn-edit"
                        onclick="editData('${mhs.nim}')"
                    >
                        ✏
                    </button>

                    <!-- DELETE -->
                    <button
                        class="btn-aksi btn-delete"
                        onclick="deleteData('${mhs.nim}')"
                    >
                        🗑
                    </button>

                </td>

            `;

            tableBody.appendChild(row);

        });
    }

    // =====================================================
    // DELETE DATA
    // =====================================================

    function deleteData(nim){

        if(confirm("Hapus data dengan NIM : " + nim + " ?")){

            let list = JSON.parse(localStorage.getItem("mhsList")) || [];

            list = list.filter(item => item.nim !== nim);

            localStorage.setItem("mhsList", JSON.stringify(list));

            displayData();
        }
    }

    // =====================================================
    // EDIT DATA
    // =====================================================

    function editData(nim){

        let list = JSON.parse(localStorage.getItem("mhsList")) || [];

        const mhs = list.find(item => item.nim === nim);

        if(mhs){

            document.getElementById("nim").value = mhs.nim;

            document.getElementById("nama").value = mhs.nama;

            document.getElementById("alamat").value = mhs.alamat;

            if(mhs.jk !== "-"){

                document.querySelector(
                    `input[name="jk"][value="${mhs.jk}"]`
                ).checked = true;
            }

            const ttl = mhs.ttl.split("-");

            document.getElementById("tanggal").value = ttl[0].trim();

            document.getElementById("bulan").value = ttl[1].trim();

            document.getElementById("tahun").value = ttl[2].trim();

            updateTanggal();

            document.getElementById("tanggal").value = ttl[0].trim();

            document.getElementById("password").value = mhs.password;

            window.scrollTo(0,0);
        }
    }

    // =====================================================
    // CLEAR FORM
    // =====================================================

    function clearForm(){

        form.reset();

        updateTanggal();
    }

    // =====================================================
    // SEARCH TABLE
    // =====================================================

    function searchTable(){

        let input = document.getElementById("searchInput");

        let filter = input.value.toLowerCase();

        let table = document.querySelector("table");

        let tr = table.getElementsByTagName("tr");

        for(let i = 1; i < tr.length; i++){

            let tdNIM = tr[i].getElementsByTagName("td")[0];

            let tdNama = tr[i].getElementsByTagName("td")[1];

            if(tdNIM || tdNama){

                let txtNIM = tdNIM.textContent || tdNIM.innerText;

                let txtNama = tdNama.textContent || tdNama.innerText;

                if(
                    txtNIM.toLowerCase().indexOf(filter) > -1 ||
                    txtNama.toLowerCase().indexOf(filter) > -1
                ){

                    tr[i].style.display = "";

                }else{

                    tr[i].style.display = "none";
                }
            }
        }
    }

</script>

</body>
</html>
